<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LogTriage Assistant</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --panel-2: #1f2937;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --good: #22c55e;
      --warn: #f59e0b;
      --bad: #ef4444;
      --border: #334155;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Segoe UI, sans-serif;
      background: linear-gradient(180deg, #0b1120, #111827);
      color: var(--text);
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 20px 60px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 2.25rem;
    }

    .page-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    .subtitle {
      color: var(--muted);
      margin-bottom: 24px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 20px;
    }

    .panel {
      background: rgba(17, 24, 39, 0.95);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }

    textarea {
      width: 100%;
      min-height: 350px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #0b1220;
      color: var(--text);
      padding: 14px;
      resize: vertical;
      font-family: Consolas, monospace;
      line-height: 1.5;
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 11px 18px;
      background: var(--accent);
      color: #082f49;
      font-weight: 700;
      cursor: pointer;
    }

    button.secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }

    button.ghost {
      background: rgba(148, 163, 184, 0.08);
      color: var(--text);
      border: 1px solid var(--border);
    }

    button.danger {
      background: transparent;
      border: 1px solid rgba(239, 68, 68, 0.45);
      color: #fca5a5;
    }

    .history-item-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    label.file {
      display: inline-block;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 18px;
      cursor: pointer;
    }

    input[type="file"] {
      display: none;
    }

    .badge {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      border: 1px solid var(--border);
      margin-bottom: 12px;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      color: var(--muted);
      margin-bottom: 14px;
      font-size: 0.95rem;
    }

    .result-box {
      margin-top: 18px;
      background: #0b1220;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
    }

    .summary {
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 14px;
    }

    ul {
      padding-left: 18px;
      color: var(--text);
    }

    li {
      margin-bottom: 8px;
      line-height: 1.5;
    }

    .finding {
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      border-radius: 10px;
      padding: 12px;
      margin-top: 12px;
      background: rgba(15, 23, 42, 0.8);
    }

    .finding h4 {
      margin: 0 0 6px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .tag {
      display: inline-block;
      border-radius: 8px;
      padding: 3px 8px;
      font-size: 0.74rem;
      font-weight: 700;
      border: 1px solid transparent;
    }

    .tag.critical { background: rgba(239,68,68,0.12); color: #fca5a5; border-color: rgba(239,68,68,0.3); }
    .tag.high { background: rgba(245,158,11,0.12); color: #fcd34d; border-color: rgba(245,158,11,0.3); }
    .tag.medium { background: rgba(59,130,246,0.12); color: #93c5fd; border-color: rgba(59,130,246,0.3); }
    .tag.info { background: rgba(34,197,94,0.12); color: #86efac; border-color: rgba(34,197,94,0.3); }

    .status {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .history-filters {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 200px;
      gap: 12px;
      margin-bottom: 12px;
    }

    .history-filters label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .history-filters input,
    .history-filters select {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      background: #0b1220;
      color: var(--text);
      font: inherit;
    }

    @media (max-width: 800px) {
      .grid { grid-template-columns: 1fr; }
      .history-filters { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="page-header">
      <h1>LogTriage Assistant</h1>
      <button class="secondary" id="logoutBtn" type="button">Sign out</button>
    </div>
    <div class="subtitle">Fast log triage for failures, timeouts, dependency issues, and deployment regressions.</div>

    <div class="grid">
      <div class="panel">
        <textarea id="logInput" placeholder="Paste log output here or upload a .log/.txt/.json file..."></textarea>
        <div class="actions">
          <button id="analyzeBtn">Analyze Log</button>
          <label class="file" for="fileInput">Upload File</label>
          <input id="fileInput" type="file" accept=".txt,.log,.json,.csv" />
          <button class="secondary" id="sampleBtn">Load Sample</button>
          <button class="ghost" id="clearBtn" type="button">Clear</button>
        </div>
      </div>

      <div class="panel" id="resultPanel">
        <div class="badge" id="severityBadge">Awaiting analysis</div>
        <div class="meta">
          <span id="fileNameMeta">No file selected</span>
          <span id="confidenceMeta">Confidence: --</span>
        </div>
        <div class="actions" style="margin-top: 0; margin-bottom: 12px;">
          <button class="secondary" id="copyBtn" type="button">Copy Summary</button>
          <button class="secondary" id="downloadBtn" type="button">Download JSON</button>
        </div>
        <div id="actionStatus" class="status" role="status" aria-live="polite"></div>
        <div id="resultContent" class="result-box">
          <div class="status">Paste a log and click “Analyze Log” to begin.</div>
        </div>
      </div>
    </div>

    <div class="panel" style="margin-top:20px;">
      <h3 style="margin-top:0;">Recent analyses</h3>
      <div class="history-filters">
        <label for="historySearch">Search saved analyses
          <input id="historySearch" type="search" placeholder="Search file name, summary, or finding..." />
        </label>
        <label for="historySeverity">Severity
          <select id="historySeverity">
            <option value="">All severities</option>
            <option value="CRITICAL">Critical</option>
            <option value="HIGH">High</option>
            <option value="MEDIUM">Medium</option>
            <option value="INFO">Info</option>
          </select>
        </label>
      </div>
      <div id="historyCount" class="status"></div>
      <div id="recentList" class="status">Loading recent history...</div>
      <div class="actions" style="margin-top: 12px;">
        <button class="secondary" id="historyPrevious" type="button" disabled>Previous</button>
        <button class="secondary" id="historyNext" type="button" disabled>Next</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
