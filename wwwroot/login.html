<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in · LogTriage Assistant</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Segoe UI, sans-serif;
      background: #0b1120;
      color: #e5e7eb;
    }

    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; }
    main { width: min(100%, 420px); padding: 28px; border: 1px solid #334155; border-radius: 14px; background: #111827; }
    h1 { margin: 0 0 8px; }
    p, .status { color: #94a3b8; line-height: 1.5; }
    form { display: grid; gap: 16px; margin-top: 24px; }
    label { display: grid; gap: 7px; }
    input { padding: 12px; border: 1px solid #334155; border-radius: 8px; background: #0b1220; color: inherit; font: inherit; }
    button { padding: 12px; border: 0; border-radius: 8px; background: #38bdf8; color: #082f49; font: inherit; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: wait; }
    .status { min-height: 1.5em; }
  </style>
</head>
<body>
  <main>
    <h1>LogTriage Assistant</h1>
    <p>Sign in to access saved analyses and log triage tools.</p>
    <form id="loginForm">
      <label for="username">Username
        <input id="username" name="username" autocomplete="username" required maxlength="100" />
      </label>
      <label for="password">Password
        <input id="password" name="password" type="password" autocomplete="current-password" required />
      </label>
      <button id="loginButton" type="submit">Sign in</button>
      <div id="loginStatus" class="status" role="status" aria-live="polite"></div>
    </form>
  </main>
  <script src="login.js"></script>
</body>
</html>
